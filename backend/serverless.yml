service: venue-control-api-${env:STUDENT_CODE}
frameworkVersion: ~4.45.0

provider:
  name: aws
  runtime: nodejs22.x
  region: ${env:AWS_REGION}
  stage: dev
  iam:
    role: ${env:LAMBDA_ROLE_ARN}

plugins:
  - serverless-offline

functions:
  # ── GET /zones ─────────────────────────────────────────────────────────────
  listZones:
    handler: dist/zones/list.handler
    events:
      - http:
          path: zones
          method: get
          cors: true

  # ── GET /zones/{id} ────────────────────────────────────────────────────────
  getZone:
    handler: dist/zones/get.handler
    events:
      - http:
          path: zones/{id}
          method: get
          cors: true

  # ── POST /zones ────────────────────────────────────────────────────────────
  createZone:
    handler: dist/zones/create.handler
    events:
      - http:
          path: zones
          method: post
          cors: true

  # ── PUT /zones/{id} ────────────────────────────────────────────────────────
  replaceZone:
    handler: dist/zones/replace.handler
    events:
      - http:
          path: zones/{id}
          method: put
          cors: true

  # ── PATCH /zones/{id} ──────────────────────────────────────────────────────
  updateZoneStatus:
    handler: dist/zones/update.handler
    events:
      - http:
          path: zones/{id}
          method: patch
          cors: true

  # ── DELETE /zones/{id} ─────────────────────────────────────────────────────
  deleteZone:
    handler: dist/zones/delete.handler
    events:
      - http:
          path: zones/{id}
          method: delete
          cors: true